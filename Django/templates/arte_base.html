<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Galería Sorpresa 🎨{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- ESTILOS GLOBALES DE LA GALERÍA -->
    <style>
        body.modo-oscuro {
    background-color: #121212;
    color: #ffffff;
        }
        body { transition: background-color 0.4s ease, color 0.4s ease; }
        
        body.modo-oscuro {
            background-color: #121212 !important;
            color: #00ff41 !important; 
        }
        
        body.modo-oscuro .navbar {
            background-color: #1a1a1a !important;
            border-bottom: 1px solid #333;
        }
        
        body.modo-oscuro .navbar-brand,
        body.modo-oscuro .nav-link {
            color: #00ff41 !important;
        }
        
        /* Efecto al pasar el mouse por los enlaces en modo oscuro */
        body.modo-oscuro .btn-outline-secondary {
            color: #00ff41;
            border-color: #00ff41;
        }
        body.modo-oscuro .btn-outline-secondary:hover {
            background-color: #00ff41;
            color: #121212 !important;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body class="modo-oscuro">

    <!-- BARRA DE NAVEGACIÓN RESTAURADA -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm mb-4">
        <div class="container-fluid px-4">
            
            <!-- 1. INICIO -->
            <a href="{% url 'inicio' %}" class="navbar-brand fw-bold">⛩️ INICIO</a>
            
            <!-- Botón hamburguesa para celulares -->
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <!-- 2. PRODUCTOS Y ARTE (Alineados a la derecha) -->
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a href="{% url 'productos:index' %}" class="btn btn-outline-secondary w-100">Productos 📦</a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'arte_sorpresa' %}" class="btn btn-outline-secondary w-100">Galería 🐈</a>
                    </li>
                </ul>
            </div>
            
        </div>
    </nav>

    <!-- Contenedor Principal de la Galería -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <!-- SCRIPT GLOBAL DEL MODO OSCURO -->
    <script>
        function toggleTema() {
            document.body.classList.toggle('modo-oscuro');
        }
    </script>

    {% block extra_js %}{% endblock %}
</body>

</html>
