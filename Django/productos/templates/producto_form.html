{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 text-center">
    <h1>Aqui puedes agregar tus productos 🛠️📦 </h1>
    <p> Rellena el formulari 🛠️ </p>
    <hr>
</div>
<form
    novalidate 
    action="{% url 'productos:formulario' %}" 
    method='post'>
    {% csrf_token %} 
    {{ form }}
    <button type="submit" class="btn btn-primary">
    Guardar  💾
</button>

</form> 

 {% endblock %}
